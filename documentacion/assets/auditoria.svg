<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hallazgos de la auditoría</title><desc id="d">Diez hallazgos: una gravedad alta, seis medias y tres bajas, con su número de issue</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="556" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="555" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Auditoría de coherencia: 10 hallazgos</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >documentación frente a código · inspección estática · issues #72 a #81</text><rect x="40" y="76" width="920" height="76" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1" filter="url(#sombra)"/><rect x="60.0" y="94" width="80.0" height="36" rx="8" fill="#ff6b6b" fill-opacity=".9"/><text x="100.0" y="118" font-size="14" fill="#10131f" font-weight="800" text-anchor="middle" >1 Alta</text><rect x="144.0" y="94" width="500.0" height="36" rx="8" fill="#ffb000" fill-opacity=".9"/><text x="394.0" y="118" font-size="14" fill="#10131f" font-weight="800" text-anchor="middle" >6 Media</text><rect x="648.0" y="94" width="248.0" height="36" rx="8" fill="#5aa9ff" fill-opacity=".9"/><text x="772.0" y="118" font-size="14" fill="#10131f" font-weight="800" text-anchor="middle" >3 Baja</text><rect x="40" y="158" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.7"/><rect x="40" y="158" width="5" height="30" rx="2.5" fill="#ff6b6b"/><text x="60" y="178" font-size="13" fill="#ff6b6b" font-weight="800" text-anchor="start" >#72</text><text x="112" y="178" font-size="12" fill="#ff6b6b" font-weight="700" text-anchor="start" >Alta</text><text x="170" y="178" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >/api/resolve y ?target= están en el contrato y no en el backend</text><rect x="40" y="192" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.35"/><rect x="40" y="192" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="212" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#73</text><text x="112" y="212" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="212" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >/api/frames: band=all, cmap y stretch sqrt/log/zscale no se aceptan</text><rect x="40" y="226" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.7"/><rect x="40" y="226" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="246" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#74</text><text x="112" y="246" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="246" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >La URL no lleva target, fps, stretch ni mode</text><rect x="40" y="260" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.35"/><rect x="40" y="260" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="280" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#75</text><text x="112" y="280" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="280" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >/api/grid y /api/frame sostienen el Explorador y están fuera de contrato</text><rect x="40" y="294" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.7"/><rect x="40" y="294" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="314" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#76</text><text x="112" y="314" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="314" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >_banda() deduce la banda del nombre: «NO verificado contra IRSA»</text><rect x="40" y="328" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.35"/><rect x="40" y="328" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="348" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#77</text><text x="112" y="348" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="348" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >El backend se despliega a mano: producción puede diverger de main</text><rect x="40" y="362" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.7"/><rect x="40" y="362" width="5" height="30" rx="2.5" fill="#ffb000"/><text x="60" y="382" font-size="13" fill="#ffb000" font-weight="800" text-anchor="start" >#78</text><text x="112" y="382" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >Media</text><text x="170" y="382" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Caché «precalentada al arrancar»: sin gancho visible (por confirmar)</text><rect x="40" y="396" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.35"/><rect x="40" y="396" width="5" height="30" rx="2.5" fill="#5aa9ff"/><text x="60" y="416" font-size="13" fill="#5aa9ff" font-weight="800" text-anchor="start" >#79</text><text x="112" y="416" font-size="12" fill="#5aa9ff" font-weight="700" text-anchor="start" >Baja</text><text x="170" y="416" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >/api/health y OpenAPI desactualizados</text><rect x="40" y="430" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.7"/><rect x="40" y="430" width="5" height="30" rx="2.5" fill="#5aa9ff"/><text x="60" y="450" font-size="13" fill="#5aa9ff" font-weight="800" text-anchor="start" >#80</text><text x="112" y="450" font-size="12" fill="#5aa9ff" font-weight="700" text-anchor="start" >Baja</text><text x="170" y="450" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >CI laxo: ruff con || true, sin pruebas de frontend</text><rect x="40" y="464" width="920" height="30" rx="8" fill="#141b33" fill-opacity="0.35"/><rect x="40" y="464" width="5" height="30" rx="2.5" fill="#5aa9ff"/><text x="60" y="484" font-size="13" fill="#5aa9ff" font-weight="800" text-anchor="start" >#81</text><text x="112" y="484" font-size="12" fill="#5aa9ff" font-weight="700" text-anchor="start" >Baja</text><text x="170" y="484" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >CORS por defecto solo localhost:5173</text><text x="500" y="536" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Ninguno impide la demo; hacen que el contrato de la API no sea fiable.</text>
