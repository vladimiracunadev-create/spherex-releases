<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" width="1000" height="512" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hoja de ruta</title><desc id="d">Tres horizontes: ahora (contrato y despliegue), siguiente (confianza y calidad) y después (ampliar el visor)</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="512" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="511" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Hoja de ruta propuesta</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >reúne lo que el repositorio oficial ya dejó anotado · orden sugerido, no un compromiso</text><rect x="40" y="78" width="296" height="392" rx="12" fill="#141b33" stroke="#ff6b6b" stroke-width="1" filter="url(#sombra)"/><rect x="40" y="78" width="296" height="52" rx="12" fill="#ff6b6b" fill-opacity=".16"/><text x="60" y="102" font-size="15" fill="#ff6b6b" font-weight="800" text-anchor="start" >AHORA</text><text x="60" y="120" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >contrato y despliegue</text><circle cx="68" cy="154" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="158" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Decidir /api/resolve (#72)</text><circle cx="68" cy="198" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="202" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Alinear /api/frames (#73)</text><circle cx="68" cy="242" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="246" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Documentar la URL (#74)</text><circle cx="68" cy="286" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="290" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Rutas /api/grid y /frame (#75)</text><circle cx="68" cy="330" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="334" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Verificar _banda() (#76)</text><circle cx="68" cy="374" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="378" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Redesplegar el backend (#77)</text><circle cx="68" cy="418" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/><text x="84" y="422" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >CI: ruff sin || true (#80)</text><rect x="352" y="78" width="296" height="392" rx="12" fill="#141b33" stroke="#ffb000" stroke-width="1" filter="url(#sombra)"/><rect x="352" y="78" width="296" height="52" rx="12" fill="#ffb000" fill-opacity=".16"/><text x="372" y="102" font-size="15" fill="#ffb000" font-weight="800" text-anchor="start" >SIGUIENTE</text><text x="372" y="120" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >confianza y calidad</text><circle cx="380" cy="154" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="158" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Probar la PWA en un iPhone real</text><circle cx="380" cy="198" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="202" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Probar los instaladores</text><circle cx="380" cy="242" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="246" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Pruebas automáticas del visor</text><circle cx="380" cy="286" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="290" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Pruebas con usuarios nuevos</text><circle cx="380" cy="330" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="334" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Avisar cuando el objeto satura</text><circle cx="380" cy="374" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="378" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Caché «al arrancar» (#78)</text><circle cx="380" cy="418" r="5" fill="none" stroke="#ffb000" stroke-width="2"/><text x="396" y="422" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Confirmar CORS (#81)</text><rect x="664" y="78" width="296" height="392" rx="12" fill="#141b33" stroke="#5aa9ff" stroke-width="1" filter="url(#sombra)"/><rect x="664" y="78" width="296" height="52" rx="12" fill="#5aa9ff" fill-opacity=".16"/><text x="684" y="102" font-size="15" fill="#5aa9ff" font-weight="800" text-anchor="start" >DESPUÉS</text><text x="684" y="120" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >ampliar el visor</text><circle cx="692" cy="154" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="158" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >λ igualada en /api/frames</text><circle cx="692" cy="198" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="202" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Colecciones _deep por defecto</text><circle cx="692" cy="242" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="246" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Fotometría y curvas de luz</text><circle cx="692" cy="286" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="290" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Posición de estrellas saturadas</text><circle cx="692" cy="330" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="334" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Caché que sirva en Vercel</text><circle cx="692" cy="374" r="5" fill="none" stroke="#5aa9ff" stroke-width="2"/><text x="708" y="378" font-size="13" fill="#eef1f8" font-weight="400" text-anchor="start" >Cribado asistido de candidatos</text><text x="500" y="494" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Decisiones no técnicas: cuenta Apple Developer · firma de instaladores · licencia y mantenimiento</text>
</svg>
