<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Filtro lineal variable y dispersión de longitud de onda</title><desc id="d">Dos exposiciones del mismo cielo a longitudes de onda distintas, y la dispersión de 0,474 micrómetros con selección ingenua frente a 0,035 igualando la longitud de onda</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
<linearGradient id="lvf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b21b6"/><stop offset=".35" stop-color="#1d4ed8"/><stop offset=".7" stop-color="#b45309"/><stop offset="1" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1000" height="380" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="379" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="19" fill="#eef1f8" font-weight="700" text-anchor="middle" >El filtro lineal variable: el color depende de dónde cae la estrella</text><rect x="40" y="64" width="520" height="290" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1" filter="url(#sombra)"/><text x="60" y="92" font-size="14" fill="#ffb000" font-weight="700" text-anchor="start" >El mismo trozo de cielo, dos exposiciones</text><rect x="80" y="104" width="440" height="78" rx="8" fill="url(#lvf)" stroke="#2b3557"/><circle cx="150" cy="143" r="9" fill="#fff"/><circle cx="150" cy="143" r="17" fill="none" stroke="#fff" stroke-opacity=".55"/><line x1="150" y1="182" x2="150" y2="192" stroke="#ffb000" stroke-width="2"/><text x="150" y="208" font-size="12.5" fill="#ffb000" font-weight="700" text-anchor="middle" >λ = 3,82 µm</text><text x="90" y="122" font-size="11.5" fill="#fff" font-weight="600" text-anchor="start" fill-opacity=".9">exposición 1</text><rect x="80" y="218" width="440" height="78" rx="8" fill="url(#lvf)" stroke="#2b3557"/><circle cx="420" cy="257" r="9" fill="#fff"/><circle cx="420" cy="257" r="17" fill="none" stroke="#fff" stroke-opacity=".55"/><line x1="420" y1="296" x2="420" y2="306" stroke="#ffb000" stroke-width="2"/><text x="420" y="322" font-size="12.5" fill="#ffb000" font-weight="700" text-anchor="middle" >λ = 4,41 µm</text><text x="90" y="236" font-size="11.5" fill="#fff" font-weight="600" text-anchor="start" fill-opacity=".9">exposición 2</text><text x="300" y="346" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Al comparar fechas hay que igualar la λ, o se compara color y no tiempo</text><rect x="590" y="64" width="370" height="290" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1" filter="url(#sombra)"/><text x="610" y="92" font-size="14" fill="#ffb000" font-weight="700" text-anchor="start" >Dispersión de λ en WISE 0855 (D5)</text><text x="610" y="112" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >4 fotogramas, uno por barrido</text><text x="610" y="160" font-size="12.5" fill="#eef1f8" font-weight="600" text-anchor="start" >Selección ingenua</text><rect x="610" y="170" width="313" height="30" rx="6" fill="#ff6b6b"/><text x="914.8399999999999" y="190" font-size="13" fill="#fff" font-weight="800" text-anchor="end" >0,474 µm</text><text x="610" y="240" font-size="12.5" fill="#eef1f8" font-weight="600" text-anchor="start" >A λ igualada</text><rect x="610" y="250" width="23" height="30" rx="6" fill="#4ade80"/><text x="643.1" y="270" font-size="13" fill="#4ade80" font-weight="800" text-anchor="start" >0,035 µm</text><text x="610" y="316" font-size="14" fill="#ffb000" font-weight="800" text-anchor="start" >14 veces menos dispersión</text><text x="610" y="336" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Medido con datos reales (EDA, 14-nov-2026)</text>
</svg>
