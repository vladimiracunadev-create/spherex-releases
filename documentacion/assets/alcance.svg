<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="460" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="459" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Quién lo usa y qué obtiene</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >madurez según lo comprobado: es un prototipo de hackatón, sin datos de usuarios</text><rect x="40" y="84" width="250" height="64" rx="12" fill="#1b2447" stroke="#ffb000" stroke-width="1.4" filter="url(#sombra)"/><text x="165" y="112" font-size="17" fill="#ffb000" font-weight="800" text-anchor="middle" >AstroTrack</text><text x="165" y="132" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >datos NASA · IRSA</text><path d="M290 116 C340 116 330 118 370 118" fill="none" stroke="#4ade80" stroke-opacity=".7" stroke-width="1.8"/><rect x="370" y="84" width="590" height="70" rx="12" fill="#141b33" stroke="#4ade80" stroke-width="1" filter="url(#sombra)"/><text x="390" y="110" font-size="15" fill="#eef1f8" font-weight="800" text-anchor="start" >Público y ciencia ciudadana</text><text x="390" y="130" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Necesita: Mirar el cielo sin saber astronomía</text><text x="390" y="146" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Recibe: Vista simple · tutorial · Modo Misión</text><rect x="868" y="106" width="76" height="26" rx="13" fill="#4ade80" fill-opacity=".18" stroke="#4ade80"/><text x="906" y="124" font-size="12.5" fill="#4ade80" font-weight="700" text-anchor="middle" >Alta</text><path d="M290 116 C340 116 330 202 370 202" fill="none" stroke="#ffb000" stroke-opacity=".7" stroke-width="1.8"/><rect x="370" y="168" width="590" height="70" rx="12" fill="#141b33" stroke="#ffb000" stroke-width="1" filter="url(#sombra)"/><text x="390" y="194" font-size="15" fill="#eef1f8" font-weight="800" text-anchor="start" >Educación y divulgación</text><text x="390" y="214" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Necesita: Material visual y guiado</text><text x="390" y="230" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Recibe: 5 niveles · glosario · ES / EN</text><rect x="868" y="190" width="76" height="26" rx="13" fill="#ffb000" fill-opacity=".18" stroke="#ffb000"/><text x="906" y="208" font-size="12.5" fill="#ffb000" font-weight="700" text-anchor="middle" >Media</text><path d="M290 116 C340 116 330 286 370 286" fill="none" stroke="#ffb000" stroke-opacity=".7" stroke-width="1.8"/><rect x="370" y="252" width="590" height="70" rx="12" fill="#141b33" stroke="#ffb000" stroke-width="1" filter="url(#sombra)"/><text x="390" y="278" font-size="15" fill="#eef1f8" font-weight="800" text-anchor="start" >Astrónomos aficionados y profesionales</text><text x="390" y="298" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Necesita: Revisar candidatos que se mueven</text><text x="390" y="314" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Recibe: Explorador · resta · apilado · espectro</text><rect x="868" y="274" width="76" height="26" rx="13" fill="#ffb000" fill-opacity=".18" stroke="#ffb000"/><text x="906" y="292" font-size="12.5" fill="#ffb000" font-weight="700" text-anchor="middle" >Media</text><path d="M290 116 C340 116 330 370 370 370" fill="none" stroke="#ff6b6b" stroke-opacity=".7" stroke-width="1.8"/><rect x="370" y="336" width="590" height="70" rx="12" fill="#141b33" stroke="#ff6b6b" stroke-width="1" filter="url(#sombra)"/><text x="390" y="362" font-size="15" fill="#eef1f8" font-weight="800" text-anchor="start" >Otros proyectos</text><text x="390" y="382" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Necesita: Una URL o API para incrustar</text><text x="390" y="398" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >Recibe: URL con posición y banda</text><rect x="868" y="358" width="76" height="26" rx="13" fill="#ff6b6b" fill-opacity=".18" stroke="#ff6b6b"/><text x="906" y="376" font-size="12.5" fill="#ff6b6b" font-weight="700" text-anchor="middle" >Baja</text><text x="500" y="440" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Madurez: Alta = caso de uso cubierto · Baja = parcial (la URL guarda solo parte del estado)</text>
</svg>
