<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pipeline de release</title><desc id="d">Una etiqueta dispara la construcción de la PWA, los instaladores de escritorio y el APK, que se adjuntan al mismo release de GitHub</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="380" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="379" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Un release: de la etiqueta a las descargas</text><rect x="40" y="100" width="150" height="80" rx="12" fill="#1b2447" stroke="#ffb000" stroke-width="1.5" filter="url(#sombra)"/><text x="115" y="132" font-size="15" fill="#ffb000" font-weight="700" text-anchor="middle" >Etiqueta</text><text x="115" y="154" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >git tag vX.Y.Z</text><rect x="240" y="100" width="170" height="80" rx="12" fill="#141b33" stroke="#5aa9ff" stroke-width="1" filter="url(#sombra)"/><text x="325" y="132" font-size="15" fill="#5aa9ff" font-weight="700" text-anchor="middle" >Job pwa</text><text x="325" y="154" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >npm ci · build · zip</text><path d="M190 140 H240" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><rect x="480" y="62" width="200" height="72" rx="12" fill="#141b33" stroke="#a78bfa" stroke-width="1" filter="url(#sombra)"/><text x="580" y="92" font-size="13.5" fill="#a78bfa" font-weight="700" text-anchor="middle" >Escritorio · Tauri 2</text><text x="580" y="114" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Windows · macOS · Linux</text><rect x="480" y="146" width="200" height="72" rx="12" fill="#141b33" stroke="#4ade80" stroke-width="1" filter="url(#sombra)"/><text x="580" y="176" font-size="13.5" fill="#4ade80" font-weight="700" text-anchor="middle" >Android · Capacitor 6</text><text x="580" y="198" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >APK (clave de depuración)</text><path d="M410 128 C440 128 450 98 480 98" fill="none" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><path d="M410 152 C440 152 450 182 480 182" fill="none" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><rect x="750" y="100" width="210" height="80" rx="12" fill="#1b2447" stroke="#ffb000" stroke-width="1.5" filter="url(#sombra)"/><text x="855" y="132" font-size="15" fill="#ffb000" font-weight="700" text-anchor="middle" >Release de GitHub</text><text x="855" y="154" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >7 archivos + notas</text><path d="M680 98 C715 98 720 128 750 128" fill="none" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><path d="M680 182 C715 182 720 152 750 152" fill="none" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><rect x="40" y="232" width="420" height="96" rx="12" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="60" y="258" font-size="13.5" fill="#ffb000" font-weight="700" text-anchor="start" >Versión estampada desde la etiqueta</text><text x="60" y="280" font-size="12" fill="#eef1f8" font-weight="400" text-anchor="start" font-family="ui-monospace, Consolas, monospace">native/estampar_version.mjs  X.Y.Z  tauri | android</text><text x="60" y="302" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >→ tauri.conf.json, Cargo.toml, versionName y versionCode</text><rect x="490" y="232" width="470" height="96" rx="12" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="510" y="258" font-size="13.5" fill="#ffb000" font-weight="700" text-anchor="start" >Copia pública</text><text x="510" y="280" font-size="12" fill="#eef1f8" font-weight="400" text-anchor="start" >spherex-releases: mismos archivos + SHA-256</text><text x="510" y="302" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="start" >y una página que toma la última versión sola</text><text x="500" y="360" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >El CI completo tarda ~11 minutos</text>
</svg>
