ía</text><text x="861" y="434" font-size="12" fill="#eef1f8" font-weight="600" text-anchor="middle" >¿Otro proyecto lo incrusta?</text><text x="500" y="484" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >[Hipótesis] Medir exigiría agregar analítica respetando la privacidad, o hacer pruebas con 5 a 8 personas.</text>
