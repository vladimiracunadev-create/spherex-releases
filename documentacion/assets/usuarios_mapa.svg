<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="544" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="543" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Quién usa AstroTrack</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >siete tipos de usuario según lo que ya saben de astronomía y cuánto profundizan · hipótesis de análisis</text><rect x="80" y="84" width="860" height="380" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1"/><line x1="510.0" y1="94" x2="510.0" y2="454" stroke="#2b3557" stroke-dasharray="4 5"/><line x1="90" y1="274.0" x2="930" y2="274.0" stroke="#2b3557" stroke-dasharray="4 5"/><text x="98" y="108" font-size="12.5" fill="#6b7699" font-weight="700" text-anchor="start" >Aprender</text><text x="528.0" y="108" font-size="12.5" fill="#6b7699" font-weight="700" text-anchor="start" >Investigar</text><text x="98" y="450" font-size="12.5" fill="#6b7699" font-weight="700" text-anchor="start" >Mirar y entender</text><text x="528.0" y="450" font-size="12.5" fill="#6b7699" font-weight="700" text-anchor="start" >Revisar rápido</text><text x="510.0" y="494" font-size="12.5" fill="#a9b3cf" font-weight="600" text-anchor="middle" >conocimiento previo de astronomía  →</text><text x="92" y="494" font-size="11.5" fill="#6b7699" font-weight="400" text-anchor="start" >ninguno</text><text x="928" y="494" font-size="11.5" fill="#6b7699" font-weight="400" text-anchor="end" >experto</text><g transform="translate(46 274.0) rotate(-90)"><text x="0" y="0" font-size="12.5" fill="#a9b3cf" font-weight="600" text-anchor="middle" >profundidad de uso  →</text></g><text x="66" y="458" font-size="11" fill="#6b7699" font-weight="400" text-anchor="end" >una visita</text><text x="66" y="98" font-size="11" fill="#6b7699" font-weight="400" text-anchor="end" >intensivo</text><circle cx="198" cy="364" r="26" fill="#4ade80" fill-opacity=".18" stroke="#4ade80" stroke-width="2"/><text x="198.0" y="370.0" font-size="16" fill="#4ade80" font-weight="800" text-anchor="middle" >U1</text><text x="198.0" y="410.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Curiosa o curioso</text><circle cx="323" cy="244" r="26" fill="#5aa9ff" fill-opacity=".18" stroke="#5aa9ff" stroke-width="2"/><text x="322.8" y="250.0" font-size="16" fill="#5aa9ff" font-weight="800" text-anchor="middle" >U2</text><text x="322.8" y="290.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Estudiante o docente</text><circle cx="448" cy="214" r="26" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf" stroke-width="2"/><text x="447.59999999999997" y="220.0" font-size="16" fill="#2dd4bf" font-weight="800" text-anchor="middle" >U3</text><text x="447.59999999999997" y="260.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Ciencia ciudadana</text><circle cx="604" cy="184" r="26" fill="#ffb000" fill-opacity=".18" stroke="#ffb000" stroke-width="2"/><text x="603.6" y="190.0" font-size="16" fill="#ffb000" font-weight="800" text-anchor="middle" >U4</text><text x="603.6" y="230.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Aficionado</text><circle cx="806" cy="160" r="26" fill="#ff6b6b" fill-opacity=".18" stroke="#ff6b6b" stroke-width="2"/><text x="806.4" y="166.0" font-size="16" fill="#ff6b6b" font-weight="800" text-anchor="middle" >U5</text><text x="806.4" y="206.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Investigación</text><circle cx="510" cy="376" r="26" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/><text x="510.0" y="382.0" font-size="16" fill="#a78bfa" font-weight="800" text-anchor="middle" >U6</text><text x="510.0" y="422.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Jurado o evaluador</text><circle cx="697" cy="280" r="26" fill="#fb923c" fill-opacity=".18" stroke="#fb923c" stroke-width="2"/><text x="697.2" y="286.0" font-size="16" fill="#fb923c" font-weight="800" text-anchor="middle" >U7</text><text x="697.2" y="326.0" font-size="12.5" fill="#eef1f8" font-weight="700" text-anchor="middle" >Integrador o desarrollo</text><text x="500" y="524" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Las posiciones son una estimación de diseño: no hay entrevistas ni analítica que las respalden.</text>
</svg>
