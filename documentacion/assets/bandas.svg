<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Los seis detectores de SPHEREx</title><desc id="d">Barra de longitudes de onda de 0,75 a 5 micrómetros dividida en los detectores D1 a D6, con su resolución espectral R</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
<linearGradient id="vis" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".25" stop-color="#3b82f6"/><stop offset=".5" stop-color="#22c55e"/><stop offset=".75" stop-color="#eab308"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs>
<rect width="1000" height="360" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="36" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Seis detectores, 102 bandas, un solo rango</text><text x="500" y="58" font-size="13" fill="#a9b3cf" font-weight="400" text-anchor="middle" >SPHEREx cubre 0,75 – 5,0 µm: del infrarrojo cercano al borde del térmico</text><rect x="60.0" y="110" width="65.5" height="54" fill="url(#vis)"/><rect x="125.5" y="110" width="61.7" height="54" rx="6" fill="#7c3aed" fill-opacity=".85"/><text x="157.3617021276596" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D1</text><text x="163.3617021276596" y="200" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >0,75 – 1,09 µm</text><text x="163.3617021276596" y="218" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="middle" >R = 39</text><rect x="191.1" y="110" width="95.4" height="54" rx="6" fill="#3b82f6" fill-opacity=".85"/><text x="239.7446808510639" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D2</text><text x="239.7446808510639" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >1,10 – 1,62 µm</text><text x="239.7446808510639" y="204" font-size="12" fill="#3b82f6" font-weight="700" text-anchor="middle" >R = 41</text><rect x="290.3" y="110" width="144.0" height="54" rx="6" fill="#06b6d4" fill-opacity=".85"/><text x="363.3191489361703" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D3</text><text x="363.3191489361703" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >1,63 – 2,41 µm</text><text x="363.3191489361703" y="204" font-size="12" fill="#06b6d4" font-weight="700" text-anchor="middle" >R = 41</text><rect x="438.2" y="110" width="260.1" height="54" rx="6" fill="#22c55e" fill-opacity=".85"/><text x="569.2765957446809" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D4</text><text x="569.2765957446809" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >2,42 – 3,82 µm</text><text x="569.2765957446809" y="204" font-size="12" fill="#22c55e" font-weight="700" text-anchor="middle" >R = 35</text><rect x="702.2" y="110" width="106.6" height="54" rx="6" fill="#f59e0b" fill-opacity=".85"/><text x="756.5106382978724" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D5</text><text x="756.5106382978724" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >3,83 – 4,41 µm</text><text x="756.5106382978724" y="204" font-size="12" fill="#f59e0b" font-weight="700" text-anchor="middle" >R = 112</text><rect x="812.7" y="110" width="106.6" height="54" rx="6" fill="#ef4444" fill-opacity=".85"/><text x="866.9787234042553" y="142" font-size="18" fill="#fff" font-weight="800" text-anchor="middle" >D6</text><text x="866.9787234042553" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >4,42 – 5,00 µm</text><text x="866.9787234042553" y="204" font-size="12" fill="#ef4444" font-weight="700" text-anchor="middle" >R = 128</text><text x="92.76595744680851" y="142" font-size="12" fill="#fff" font-weight="600" text-anchor="middle" >visible</text><text x="84.76595744680851" y="186" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >0,4 – 0,75 µm</text><path d="M782.7 100 V82" stroke="#ffb000" stroke-width="2"/><circle cx="782.7" cy="80" r="4" fill="#ffb000"/><text x="782.7234042553192" y="70" font-size="12" fill="#ffb000" font-weight="700" text-anchor="middle" >CO₂ 4,26 µm (solo en D5)</text><line x1="172.3" y1="232" x2="172.3" y2="240" stroke="#a9b3cf"/><text x="172.3404255319149" y="256" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >1 µm</text><line x1="359.6" y1="232" x2="359.6" y2="240" stroke="#a9b3cf"/><text x="359.57446808510645" y="256" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >2 µm</text><line x1="546.8" y1="232" x2="546.8" y2="240" stroke="#a9b3cf"/><text x="546.808510638298" y="256" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >3 µm</text><line x1="734.0" y1="232" x2="734.0" y2="240" stroke="#a9b3cf"/><text x="734.0425531914894" y="256" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >4 µm</text><line x1="921.3" y1="232" x2="921.3" y2="240" stroke="#a9b3cf"/><text x="921.2765957446809" y="256" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >5 µm</text><line x1="60" y1="232" x2="940" y2="232" stroke="#a9b3cf" stroke-opacity=".5"/><rect x="60" y="280" width="880" height="56" rx="12" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="80" y="304" font-size="13" fill="#eef1f8" font-weight="600" text-anchor="start" >R es la resolución espectral: la más alta está en D5 y D6 (112 y 128); el CO₂ a 4,26 µm cae solo en D5.</text><text x="80" y="324" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Filtro lineal variable: dónde cae la fuente en el detector decide a qué longitud de onda se la mide.</text>
</svg>
