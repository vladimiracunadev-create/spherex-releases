<text x="500" y="34" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Cuatro niveles, una sola herramienta</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >cada persona entra por el nivel que le corresponde y baja o sube con el interruptor «Modo ciencia»</text><rect x="60" y="84" width="880" height="84" rx="12" fill="#141b33" stroke="#4ade80" stroke-width="1" filter="url(#sombra)"/><rect x="60" y="84" width="84" height="84" rx="12" fill="#4ade80" fill-opacity=".22"/><text x="102" y="120" font-size="26" fill="#4ade80" font-weight="800" text-anchor="middle" >1</text><text x="102" y="144" font-size="11.5" fill="#4ade80" font-weight="800" text-anchor="middle" >MIRAR</text><text x="160" y="116" font-size="14" fill="#eef1f8" font-weight="800" text-anchor="start" >Portada · vista simple · tutorial</text><text x="160" y="138" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Una imagen grande, fechas y la barra «Luz»</text><rect x="810" y="112" width="110" height="28" rx="14" fill="#4ade80" fill-opacity=".16" stroke="#4ade80"/><text x="865" y="131" font-size="12.5" fill="#4ade80" font-weight="800" text-anchor="middle" >U1 · U6</text><rect x="95" y="180" width="810" height="84" rx="12" fill="#141b33" stroke="#5aa9ff" stroke-width="1" filter="url(#sombra)"/><rect x="95" y="180" width="84" height="84" rx="12" fill="#5aa9ff" fill-opacity=".22"/><text x="137" y="216" font-size="26" fill="#5aa9ff" font-weight="800" text-anchor="middle" >2</text><text x="137" y="240" font-size="11.5" fill="#5aa9ff" font-weight="800" text-anchor="middle" >APRENDER</text><text x="195" y="212" font-size="14" fill="#eef1f8" font-weight="800" text-anchor="start" >Modo Misión · Spherix · glosario</text><text x="195" y="234" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Cinco niveles guiados con fotos reales</text><rect x="775" y="208" width="110" height="28" rx="14" fill="#5aa9ff" fill-opacity=".16" stroke="#5aa9ff"/><text x="830" y="227" font-size="12.5" fill="#5aa9ff" font-weight="800" text-anchor="middle" >U2 · U3</text><rect x="130" y="276" width="740" height="84" rx="12" fill="#141b33" stroke="#ffb000" stroke-width="1" filter="url(#sombra)"/><rect x="130" y="276" width="84" height="84" rx="12" fill="#ffb000" fill-opacity=".22"/><text x="172" y="312" font-size="26" fill="#ffb000" font-weight="800" text-anchor="middle" >3</text><text x="172" y="336" font-size="11.5" fill="#ffb000" font-weight="800" text-anchor="middle" >INVESTIGAR</text><text x="230" y="308" font-size="14" fill="#eef1f8" font-weight="800" text-anchor="start" >Explorador · Prisma · catálogos · Apuntar</text><text x="230" y="330" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Resta, apilado, espectro, «¿Qué hay aquí?»</text><rect x="740" y="304" width="110" height="28" rx="14" fill="#ffb000" fill-opacity=".16" stroke="#ffb000"/><text x="795" y="323" font-size="12.5" fill="#ffb000" font-weight="800" text-anchor="middle" >U3 · U4 · U5</text><rect x="165" y="372" width="670" height="84" rx="12" fill="#141b33" stroke="#fb923c" stroke-width="1" filter="url(#sombra)"/><rect x="165" y="372" width="84" height="84" rx="12" fill="#fb923c" fill-opacity=".22"/><text x="207" y="408" font-size="26" fill="#fb923c" font-weight="800" text-anchor="middle" >4</text><text x="207" y="432" font-size="11.5" fill="#fb923c" font-weight="800" text-anchor="middle" >INTEGRAR</text><text x="265" y="404" font-size="14" fill="#eef1f8" font-weight="800" text-anchor="start" >URL · API · descargas e instaladores</text><text x="265" y="426" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Compartir, incrustar, instalar</text><rect x="705" y="400" width="110" height="28" rx="14" fill="#fb923c" fill-opacity=".16" stroke="#fb923c"/><text x="760" y="419" font-size="12.5" fill="#fb923c" font-weight="800" text-anchor="middle" >U5 · U7</text><path d="M30 130 V380" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)" marker-start="url(#flecha)"/><g transform="translate(18 255) rotate(-90)"><text x="0" y="0" font-size="11.5" fill="#a9b3cf" font-weight="600" text-anchor="middle" >más herramientas</text></g>
