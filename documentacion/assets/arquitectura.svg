<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Arquitectura: dos vías</title><desc id="d">El visor consulta el cubo HiPS y los catálogos directamente (vía A) o el backend FastAPI por un rewrite (vía B), que consulta IRSA o sirve datos precalculados</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="490" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="489" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="36" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="middle" >Dos vías en la misma pantalla</text><text x="500" y="58" font-size="13" fill="#a9b3cf" font-weight="400" text-anchor="middle" >si una falla, la otra sigue mostrando algo</text><rect x="40" y="170" width="150" height="90" rx="12" fill="#1b2447" stroke="#ffb000" stroke-width="1.5" filter="url(#sombra)"/><circle cx="115" cy="200" r="13" fill="none" stroke="#ffb000" stroke-width="2"/><path d="M92 238 q23-30 46 0" fill="none" stroke="#ffb000" stroke-width="2"/><text x="115" y="250" font-size="14" fill="#eef1f8" font-weight="700" text-anchor="middle" >Persona</text><rect x="250" y="150" width="210" height="130" rx="12" fill="#141b33" stroke="#ffb000" stroke-width="1.5" filter="url(#sombra)"/><text x="355" y="178" font-size="16" fill="#ffb000" font-weight="700" text-anchor="middle" >Visor web</text><text x="355" y="202" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >React · Vite · TypeScript</text><text x="355" y="222" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Aladin Lite 3.8.2</text><text x="355" y="248" font-size="12.5" fill="#eef1f8" font-weight="600" text-anchor="middle" >PWA instalable</text><text x="355" y="268" font-size="12" fill="#a9b3cf" font-weight="400" text-anchor="middle" >ES / EN</text><path d="M190 215 H250" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><rect x="560" y="88" width="400" height="112" rx="12" fill="#10243a" stroke="#5aa9ff" stroke-width="1" filter="url(#sombra)"/><rect x="560" y="88" width="400" height="30" rx="12" fill="#5aa9ff" fill-opacity=".18"/><text x="580" y="108" font-size="13.5" fill="#5aa9ff" font-weight="700" text-anchor="start" >VÍA A · el cielo en 102 colores · sin backend</text><rect x="580" y="130" width="170" height="56" rx="10" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="665" y="154" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="middle" >Cubo HiPS DR1</text><text x="665" y="172" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >IRSA · CORS abierto</text><rect x="770" y="130" width="170" height="56" rx="10" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="855" y="154" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="middle" >Catálogos</text><text x="855" y="172" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >SIMBAD · Gaia · CatWISE</text><path d="M460 190 C510 190 520 150 560 150" fill="none" stroke="#5aa9ff" stroke-width="2" marker-end="url(#flecha)"/><rect x="560" y="232" width="400" height="232" rx="12" fill="#2a1f12" stroke="#ffb000" stroke-width="1" filter="url(#sombra)"/><rect x="560" y="232" width="400" height="30" rx="12" fill="#ffb000" fill-opacity=".18"/><text x="580" y="252" font-size="13.5" fill="#ffb000" font-weight="700" text-anchor="start" >VÍA B · el parpadeo temporal · con backend</text><rect x="580" y="276" width="170" height="62" rx="10" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="665" y="301" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="middle" >Rewrite /api</text><text x="665" y="320" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >mismo dominio · sin CORS</text><rect x="770" y="276" width="170" height="62" rx="10" fill="#141b33" stroke="#ffb000" stroke-width="1"/><text x="855" y="301" font-size="13" fill="#ffb000" font-weight="700" text-anchor="middle" >FastAPI</text><text x="855" y="320" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >Python 3.11 · Vercel</text><path d="M750 307 H770" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><rect x="580" y="362" width="170" height="84" rx="10" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="665" y="385" font-size="13" fill="#4ade80" font-weight="700" text-anchor="middle" >Precalculado</text><text x="665" y="404" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >5 campos de prueba</text><text x="665" y="422" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >modo sin conexión</text><rect x="770" y="362" width="170" height="84" rx="10" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="855" y="385" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="middle" >IRSA / IPAC</text><text x="855" y="404" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >SIA2 + HTTP Range</text><text x="855" y="422" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >7 s por recorte</text><path d="M855 338 V362" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)"/><path d="M770 404 H750" stroke="#a9b3cf" stroke-width="2" marker-end="url(#flecha)" stroke-dasharray="4 4"/><path d="M460 245 C510 245 520 307 560 307" fill="none" stroke="#ffb000" stroke-width="2" marker-end="url(#flechaA)"/><rect x="40" y="330" width="420" height="134" rx="12" fill="#141b33" stroke="#2b3557" stroke-width="1"/><text x="60" y="358" font-size="14" fill="#eef1f8" font-weight="700" text-anchor="start" >Por qué hace falta el backend</text><text x="60" y="382" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >IRSA no responde con CORS: el navegador no puede</text><text x="60" y="400" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >pedirle SIA2 ni archivos directo. Solo el cubo HiPS</text><text x="60" y="418" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >se carga desde el navegador.</text><text x="60" y="446" font-size="12.5" fill="#ffb000" font-weight="600" text-anchor="start" >Un recorte: mediana 7,3 s · p90 10,8 s · ~3,9 MB</text>
</svg>
