<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Movimiento medido frente al predicho</title><desc id="d">Desplazamiento en píxeles de eps Ind B, que coincide con SIMBAD, y de RW Aur, que parece moverse por la saturación</desc>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a38"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9b3cf"/></marker>
<marker id="flechaA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb000"/></marker>
</defs>
<rect width="1000" height="392" rx="16" fill="url(#fondo)"/>
<rect x=".5" y=".5" width="999" height="391" rx="16" fill="none" stroke="#2b3557"/>
<text x="500" y="34" font-size="19" fill="#eef1f8" font-weight="700" text-anchor="middle" >¿El desplazamiento medido es el que predice SIMBAD?</text><text x="500" y="56" font-size="12.5" fill="#a9b3cf" font-weight="400" text-anchor="middle" >primera y última época a λ igualada · píxeles de 6,15″ · x hacia el oeste, y hacia el norte</text><rect x="40" y="76" width="580" height="290" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1" filter="url(#sombra)"/><line x1="70" y1="230" x2="600" y2="230" stroke="#2b3557"/><line x1="330" y1="96" x2="330" y2="350" stroke="#2b3557"/><text x="596" y="222" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="end" >oeste →</text><text x="74" y="222" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="start" >← este</text><text x="338" y="104" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="start" >↑ norte</text><line x1="141" y1="222" x2="141" y2="238" stroke="#a9b3cf" stroke-opacity=".5"/><text x="141.0" y="256" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="middle" >-2 px</text><line x1="236" y1="222" x2="236" y2="238" stroke="#a9b3cf" stroke-opacity=".5"/><text x="235.5" y="256" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="middle" >-1 px</text><line x1="424" y1="222" x2="424" y2="238" stroke="#a9b3cf" stroke-opacity=".5"/><text x="424.5" y="256" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="middle" >+1 px</text><line x1="519" y1="222" x2="519" y2="238" stroke="#a9b3cf" stroke-opacity=".5"/><text x="519.0" y="256" font-size="11" fill="#a9b3cf" font-weight="400" text-anchor="middle" >+2 px</text><line x1="243.1" y1="283.9" x2="249.7" y2="297.1" stroke="#4ade80" stroke-width="2"/><circle cx="243.1" cy="283.9" r="9" fill="none" stroke="#4ade80" stroke-width="2.5"/><circle cx="249.7" cy="297.1" r="5" fill="#4ade80"/><text x="229.06" y="313.865" font-size="13" fill="#4ade80" font-weight="700" text-anchor="end" >eps Ind B</text><text x="229.06" y="329.865" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="end" >coincide a ~0,15 px</text><line x1="330.0" y1="230.0" x2="399.0" y2="114.7" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/><circle cx="330.0" cy="230.0" r="9" fill="none" stroke="#ff6b6b" stroke-width="2.5"/><circle cx="399.0" cy="114.7" r="5" fill="#ff6b6b"/><text x="410.985" y="118.71000000000001" font-size="13" fill="#ff6b6b" font-weight="700" text-anchor="start" >RW Aur</text><text x="410.985" y="134.71" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >«se mueve» sin moverse</text><text x="80" y="112" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Círculo: predicho</text><text x="80" y="128" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >Punto: medido</text><rect x="650" y="76" width="310" height="290" rx="14" fill="#141b33" stroke="#2b3557" stroke-width="1" filter="url(#sombra)"/><text x="670" y="104" font-size="15" fill="#ffb000" font-weight="700" text-anchor="start" >Lectura</text><circle cx="680" cy="134" r="5" fill="#4ade80"/><text x="694" y="139" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="start" >La alineación funciona</text><text x="694" y="157" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >las estrellas de campo se corren 0,1–0,4 px</text><circle cx="680" cy="188" r="5" fill="#4ade80"/><text x="694" y="193" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="start" >eps Ind B se mueve lo debido</text><text x="694" y="211" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >−0,85 / −0,71 px medido, −0,92 / −0,57 predicho</text><circle cx="680" cy="242" r="5" fill="#ff6b6b"/><text x="694" y="247" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="start" >Las saturadas engañan</text><text x="694" y="265" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >el núcleo enmascarado deja un anillo asimétrico</text><circle cx="680" cy="296" r="5" fill="#ffb000"/><text x="694" y="301" font-size="13" fill="#eef1f8" font-weight="700" text-anchor="start" >Barnard: no se puede medir</text><text x="694" y="319" font-size="11.5" fill="#a9b3cf" font-weight="400" text-anchor="start" >44 de 49 píxeles del núcleo, malos</text><text x="670" y="352" font-size="12" fill="#ffb000" font-weight="700" text-anchor="start" >El visor debe avisar cuando el objeto satura</text>
</svg>
